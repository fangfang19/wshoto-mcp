app = "wshoto-mcp"
primary_region = "nrt"

[build]
  builder = "node"

[http_service]
  internal_port = 3030
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "15s"
    timeout = "5s"
