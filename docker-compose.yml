services:
  mcp:
    build: .
    restart: unless-stopped
    environment:
      - PORT=3030
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3030/health',r=>{process.exit(r.statusCode===200?0:1)})"]
      interval: 30s
      timeout: 5s

  caddy:
    image: caddy:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
    depends_on:
      - mcp

volumes:
  caddy_data:
